// ─── Counter animado ──────────────────────────────────────────────────────────
function useAnimatedCounter(target, duration = 1500, deps = []) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    let frame, start;
    const initial = value;
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    const step = (ts) => {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      setValue(Math.round(initial + (target - initial) * ease(progress)));
      if (progress < 1) frame = requestAnimationFrame(step);
    };
    frame = requestAnimationFrame(step);
    return () => cancelAnimationFrame(frame);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [target, ...deps]);
  return value;
}

          {step >= 1 && (
            <div className="flex chat-bubble-in">
              <div className="bg-cream-50 text-bark-900 rounded-2xl rounded-tl-sm px-3 py-2 text-sm max-w-[80%] shadow-sm space-y-2">
                <div className="text-[11px] text-bark-500">Origen · Mapeo de finca</div>
                <button
                  onClick={onMap}
                  disabled={step >= 2}
                  className={`w-full text-sm rounded-lg px-3 py-2 transition flex items-center justify-center gap-2
                    ${step < 2 ? 'bg-amber2-500 text-bark-900 hover:bg-amber2-300' : 'bg-sage-500 text-cream-50'}`}
                >
                  {step < 2 ? (<><IconPin className="w-4 h-4"/><span>Mapear ahora</span></>) : (<><IconCheck className="w-4 h-4"/><span>Polígono enviado</span></>)}
                </button>
              </div>
            </div>
          )}
          {/* Bubble — polygon preview after mapping */}
          {step >= 2 && (
            <div className="flex justify-end chat-bubble-in">
              <div className="bg-sage-500 text-cream-50 rounded-2xl rounded-tr-sm px-2.5 py-2 text-xs max-w-[80%] shadow-sm">
                <svg viewBox="0 0 200 120" className="w-full h-24 rounded-md bg-cream-50/20">
                  <polygon
                    points="40,30 130,25 165,75 100,100 30,75"
                    fill="#F5EBD8"
                    fillOpacity="0.9"
                    stroke="#3D2E1E"
                    strokeWidth="2"
                    className={mappedAnimating ? 'map-polygon-animated' : ''}
                  />
                  <circle cx="100" cy="60" r="3" fill="#D4A24E" />
                </svg>
                <div className="mt-1.5 text-[11px] opacity-90">Polígono · 4 ha · Sítio Bom Jardim</div>
              </div>
            </div>
          )}
          {/* Bubble — verification result */}
          {step >= 3 && (
            <div className="flex chat-bubble-in">
              <div className="bg-cream-50 text-bark-900 rounded-2xl rounded-tl-sm px-3 py-3 text-sm max-w-[85%] shadow-sm">
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-sage-500"></span>
                  <span className="font-medium">Verificación: verde</span>
                </div>
                <div className="text-[12px] mt-1.5 leading-relaxed">
                  Tu finca <span className="font-medium">Sítio Bom Jardim</span> está dentro de zona libre de deforestación post-2020. Eligible para el embarque a Alemania.
                </div>
                <div className="text-[10px] mt-2 text-bark-500">Cruce: Mapbiomas v9 + Global Forest Watch · 14:32 BRT</div>
              </div>
            </div>
          )}
          {step >= 4 && (
            <div className="flex chat-bubble-in">
              <div className="bg-cream-50 text-bark-900 rounded-2xl rounded-tl-sm px-3 py-3 text-sm max-w-[85%] shadow-sm">
                <div className="text-[11px] uppercase tracking-[0.16em] text-bark-500">Premium aplicado</div>
                <div className="font-display text-2xl text-bark-900 tabular-nums mt-0.5">+ $340 USD</div>
                <div className="text-[12px] mt-1 text-bark-700">+12% sobre tonelada · pagado al liquidar el embarque · cuenta en USD</div>
              </div>
            </div>
          )}
        </div>
        <div className="border-t border-stone-200 bg-cream-50 px-3 py-2 flex items-center gap-2">
          <input className="flex-1 bg-cream-100 text-sm rounded-full px-3 py-1.5 text-bark-900 placeholder:text-bark-500 focus:outline-none" placeholder="Escribe o sube una foto…" disabled />
          <button className="w-9 h-9 rounded-full bg-sage-500 text-cream-50 grid place-items-center" disabled>
            <IconArrow className="w-4 h-4"/>
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [farms, setFarms] = useState(initialFarms);
  const [hoveredFarm, setHoveredFarm] = useState(null);
  const [phoneStep, setPhoneStep] = useState(1); // 1: invitation visible, 2: mapped, 3: verified, 4: premium
  const [newlyVerifiedId, setNewlyVerifiedId] = useState(null);
  const [polyAnim, setPolyAnim] = useState(false);
  const [bounceKpi, setBounceKpi] = useState(false);
  const [ddsState, setDdsState] = useState('idle'); // idle | loading | ready
  const [toast, setToast] = useState(null);
  const [bannerOnPhone, setBannerOnPhone] = useState(null);

  const greenCount = farms.filter(f => f.status === 'green').length;
  const totalTons = Math.round(farms.filter(f => f.status === 'green').reduce((a,f)=>a+f.ha,0) * 5.9);
  const targetReceivables = greenCount * 2700; // ~$2,700 USD por finca verde, demo
  const animatedReceivables = useAnimatedCounter(targetReceivables, 1500, [greenCount]);

  function showToast(text, kind = 'success') {
    setToast({ text, kind });
    setTimeout(() => setToast(null), 3200);
  }
  function showBanner(text) {
    setBannerOnPhone(text);
    setTimeout(() => setBannerOnPhone(null), 3500);
  }

  function handleMap() {
    if (phoneStep >= 2) return;
    setPhoneStep(2);
    setPolyAnim(true);
    setTimeout(() => setPhoneStep(3), 1700);
    setTimeout(() => {
      setPhoneStep(4);
      // Promover finca pendiente #19 a green
      setFarms(prev => prev.map(f => f.id === 19 ? { ...f, status: 'green', name: 'Mariana — Sítio Bom Jardim' } : f));
      setNewlyVerifiedId(19);
      setBounceKpi(true);
      showToast('Nueva finca verificada — Mariana, Cocamar 4ha', 'success');
      setTimeout(() => setBounceKpi(false), 700);
    }, 2600);
  }

  function handleGenerateDDS() {
    if (ddsState !== 'idle') return;
    setDdsState('loading');
    showBanner('Tu lote sale el 15-jun. Premium confirmado.');
    setTimeout(() => setDdsState('ready'), 1800);
  }

  return (
    <div className="min-h-screen flex flex-col">
      <HeaderBar />
      <main className="flex-1 max-w-[1480px] w-full mx-auto px-0 md:px-6 py-0 md:py-6 grid grid-cols-1 lg:grid-cols-[1.55fr_1fr] gap-0 md:gap-6">
        {/* ─── PANEL IZQUIERDO ─── */}
        <section className="bg-cream-100 rounded-none md:rounded-2xl border-stone-300/40 md:border md:overflow-hidden flex flex-col">
          <div className="flex flex-col md:flex-row min-h-[420px]">
            <SidebarNav active="mapa" />
            <div className="flex-1 p-4 md:p-5 space-y-4">
              {/* KPIs */}
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3 relative">
                <KpiCard label="Fincas verdes" value={`${greenCount}/28`} sub={`+${greenCount-18} verificadas hoy`} bouncing={bounceKpi} />
                <KpiCard label="Toneladas EUDR-ready" value={`${totalTons} t`} sub="Café arábica · 4,500 kg/ha avg" />
                <KpiCard label="Receivables UE desbloqueados" value={`$${animatedReceivables.toLocaleString('en-US')}`} sub="Sobre embarque #1408" highlight bouncing={bounceKpi} />
                {toast && (
                  <div className="absolute -top-2 left-2 md:left-auto md:-top-3 md:right-2 z-10 bg-bark-900 text-cream-100 rounded-lg px-3 py-2 text-xs shadow-lg toast-enter">
                    {toast.text}
                  </div>
                )}
              </div>
              {/* Mapa */}
              <MapPanel
                farms={farms}
                onFarmHover={setHoveredFarm}
                hoveredFarm={hoveredFarm}
                newlyVerifiedId={newlyVerifiedId}
              />
              {/* Lote */}
              <LotePanel farms={farms} onGenerateDDS={handleGenerateDDS} ddsState={ddsState} />
            </div>
          </div>
        </section>

        {/* ─── PANEL DERECHO ─── */}
        <section className="bg-cream-100/40 rounded-none md:rounded-2xl border-stone-300/40 md:border p-4 md:p-6 flex flex-col items-center justify-start relative">
          <div className="w-full max-w-[420px]">
            <div className="text-[10px] uppercase tracking-[0.18em] text-bark-500 mb-1">Vista del asociado</div>
            <div className="font-display text-2xl text-bark-900 leading-tight mb-1">Mariana — Cocamar</div>
            <div className="text-xs text-bark-500 mb-5">Sítio Bom Jardim · 4 ha · 🇧🇷 Minas Gerais, Brasil</div>
            {bannerOnPhone && (
              <div className="mb-3 rounded-lg bg-amber2-500 text-bark-900 text-xs font-medium px-3 py-2 toast-enter">
                {bannerOnPhone}
              </div>
            )}
          </div>
          <FarmerPhone step={phoneStep} onMap={handleMap} mappedAnimating={polyAnim} />
          <div className="mt-5 text-center text-[11px] text-bark-500 max-w-[380px] leading-relaxed">
            Tocá <span className="font-medium text-bark-900">"Mapear ahora"</span> en el chat para ver la sincronización en tiempo real con el dashboard de la cooperativa.
          </div>
        </section>
      </main>
      <footer className="border-t border-stone-300/40 bg-cream-50/60 mt-6">
        <div className="max-w-[1480px] mx-auto px-6 py-4 text-center text-[11px] text-stone-500">
          Idea original: Aguacate newsletter — aguacate-newsletter.beehiiv.com
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
