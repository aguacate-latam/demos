<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nido — Tu pedacito de ladrillo, $5 a la vez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        cream: '#FBF9F6', ink: '#2A2540', lav: '#7C5CCE', 'lav-soft': '#C9B8E8',
        butter: '#F2D45C', sky: '#4A90D9', 'sky-soft': '#A8D0F0', rose: '#E8B8C4', moss: '#3F9D7A'
      },
      fontFamily: { display: ['Newsreader','serif'], sans: ['"Plus Jakarta Sans"','sans-serif'] }
    }
  }
}
</script>
<style>
  html,body{background:#EFE9F6;margin:0}
  *{-webkit-tap-highlight-color:transparent}
  .shadow-soft{box-shadow:0 10px 30px -12px rgba(42,37,64,.22)}
  .shadow-phone{box-shadow:0 40px 80px -24px rgba(42,37,64,.45)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
  .pop{animation:pop .4s ease}
  .brick-fill{transition:height 1.1s cubic-bezier(.22,1,.36,1)}
  .tabx{transition:all .2s ease}
  .font-500{font-weight:500}.font-600{font-weight:600}.font-700{font-weight:700}.font-800{font-weight:800}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const fmt = (n)=> n.toLocaleString('es-419',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmt2 = (n)=> n.toLocaleString('es-419',{minimumFractionDigits:2,maximumFractionDigits:2});

function useCountUp(target, dur=1100){
  const [val,setVal]=useState(0);
  const from=useRef(0); const raf=useRef(null);
  useEffect(()=>{
    const start=performance.now(); const f=from.current; const delta=target-f;
    const tick=(t)=>{ const p=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-p,3);
      setVal(f+delta*e); if(p<1) raf.current=requestAnimationFrame(tick); else from.current=target; };
    raf.current=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf.current);
  },[target]);
  return val;
}

const Icon = ({d,c="#2A2540",s=22,fill="none",sw=1.7})=>(
  <svg width={s} height={s} viewBox="0 0 24 24" fill={fill} stroke={c} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{d}</svg>
);
const I = {
  home:<path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/>,
  bolt:<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>,
  coins:<g><ellipse cx="8" cy="6" rx="5" ry="2.5"/><path d="M3 6v5c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5V6"/><ellipse cx="16" cy="14" rx="5" ry="2.5"/><path d="M11 14v5c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-5"/></g>,
  sparkle:<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>,
  shield:<path d="M12 3 5 6v5c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/>,
  trend:<path d="M3 17l5-5 4 3 8-8M21 7v5h-5"/>
};

const PROPS_INIT = [
  {id:1,name:"Edificio Aurora",kind:"Apartamentos en renta",yield:8.2,frac:520,rent:3.55,c:"#7C5CCE",sc:"#C9B8E8"},
  {id:2,name:"Plaza Centro",kind:"Local comercial",yield:9.1,frac:430,rent:3.26,c:"#4A90D9",sc:"#A8D0F0"},
  {id:3,name:"Bodega Norte",kind:"Logística",yield:7.4,frac:290,rent:1.79,c:"#D98B9E",sc:"#E8B8C4"},
];

function App(){
  const GOAL=5000;
  const [invested,setInvested]=useState(1240);
  const [props,setProps]=useState(PROPS_INIT);
  const [roundup,setRoundup]=useState(false);
  const [tab,setTab]=useState('nido');
  const [pulse,setPulse]=useState(0);
  const [sellOpen,setSellOpen]=useState(false);
  const [toast,setToast]=useState(null);

  const shown = useCountUp(invested);
  const rentMonthly = props.reduce((a,p)=>a+p.rent,0);
  const rentShown = useCountUp(rentMonthly, 900);
  const pct = Math.min(100, (invested/GOAL)*100);
  const weekly = 5;
  const roundupMonthly = 12;

  const aportar = ()=>{
    setInvested(v=>v+weekly);
    setProps(ps=>ps.map((p,i)=> i===0?{...p,frac:p.frac+2,rent:+(p.rent+0.014).toFixed(2)}:
      i===1?{...p,frac:p.frac+2,rent:+(p.rent+0.015).toFixed(2)}:{...p,frac:p.frac+1,rent:+(p.rent+0.007).toFixed(2)}));
    setPulse(p=>p+1);
    showToast("Aportaste $5 — tu nido creció");
  };
  const showToast=(m)=>{ setToast(m); setTimeout(()=>setToast(null),2200); };
  const confirmSell=(amt)=>{
    setInvested(v=>Math.max(0,v-amt));
    setProps(ps=>ps.map(p=>({...p,frac:Math.max(0,Math.round(p.frac*(1-amt/invested)))})));
    setSellOpen(false);
    showToast("Venta lista — la plata llega en 2 días");
  };

  // 3-year projection: weekly 5 -> 260/yr + rent reinvested approx
  const proj = (()=>{ let bal=invested; for(let y=0;y<3;y++){ bal = bal*1.08 + 260; } return Math.round(bal); })();

  return (
    <div className="min-h-screen font-sans text-ink" style={{background:'radial-gradient(1200px 600px at 80% -5%, #E5D8F7 0%, #EFE9F6 45%, #EAF1F8 100%)'}}>
      {/* top bar */}
      <header className="max-w-6xl mx-auto px-5 pt-6 pb-2 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <div className="w-9 h-9 rounded-2xl bg-lav flex items-center justify-center shadow-soft"><Icon d={I.home} c="#fff" s={18}/></div>
          <span className="font-display text-2xl font-600 tracking-tight">Nido</span>
        </div>
        <div className="hidden sm:flex items-center gap-1 bg-white/70 backdrop-blur rounded-full p-1 shadow-soft">
          <button onClick={()=>setTab('nido')} className={"tabx px-4 py-1.5 rounded-full text-sm font-600 "+(tab==='nido'?'bg-lav text-white':'text-ink/60')}>Mi nido</button>
          <button onClick={()=>setTab('motor')} className={"tabx px-4 py-1.5 rounded-full text-sm font-600 "+(tab==='motor'?'bg-lav text-white':'text-ink/60')}>Detrás de tu plata</button>
        </div>
      </header>

      <div className="max-w-6xl mx-auto px-5 pb-3">
        <p className="font-display text-3xl sm:text-4xl leading-tight max-w-2xl mt-2">Sé dueño de un pedacito de ciudad, <span className="text-lav">$5 a la vez</span>.</p>
        <p className="text-ink/60 mt-2 max-w-xl text-[15px]">Una simulación de Nido: el ahorro suelto que se vuelve renta de ladrillo, sin enganche y sin ser experto.</p>
      </div>

      {tab==='nido' ? (
      <main className="max-w-6xl mx-auto px-5 pb-16 grid lg:grid-cols-[380px_1fr] gap-6 items-start">
        {/* PHONE */}
        <div className="mx-auto w-full max-w-[380px] bg-ink rounded-[42px] p-2.5 shadow-phone">
          <div className="bg-cream rounded-[34px] overflow-hidden">
            <div className="px-5 pt-5 pb-3 bg-gradient-to-b from-[#EDE4FA] to-cream">
              <div className="flex items-center justify-between">
                <span className="text-xs font-600 text-ink/50 uppercase tracking-wider">Mi nido</span>
                <span className="text-[11px] font-600 text-lav bg-white/80 rounded-full px-2 py-0.5">semana 64</span>
              </div>
              <div className="mt-2 flex items-end gap-2">
                <span key={pulse} className="font-display text-5xl font-600 tabular-nums pop">${fmt(shown)}</span>
                <span className="text-ink/50 text-sm mb-1.5">invertido</span>
              </div>
              {/* building fill */}
              <div className="mt-4 flex items-end gap-3">
                <div className="relative w-16 h-24 rounded-t-xl rounded-b-md bg-white/70 overflow-hidden border border-lav-soft">
                  <div className="brick-fill absolute bottom-0 left-0 right-0 bg-lav/85" style={{height:pct+'%'}}></div>
                  <div className="absolute inset-0 grid grid-cols-2 gap-[3px] p-1.5 opacity-40">
                    {Array.from({length:10}).map((_,i)=><div key={i} className="bg-white/50 rounded-[2px]"></div>)}
                  </div>
                </div>
                <div className="flex-1">
                  <div className="flex justify-between text-xs text-ink/55"><span>Meta: mi cuota inicial</span><span className="font-700 text-ink">{Math.round(pct)}%</span></div>
                  <div className="h-2 rounded-full bg-white mt-1 overflow-hidden"><div className="h-full bg-butter brick-fill" style={{width:pct+'%'}}></div></div>
                  <p className="text-[11px] text-ink/45 mt-1.5">${fmt(invested)} de ${fmt(GOAL)} — el edificio se llena solo</p>
                </div>
              </div>
            </div>

            {/* rent + drip */}
            <div className="px-5 py-3 grid grid-cols-2 gap-2.5">
              <div className="bg-white rounded-2xl p-3 shadow-soft">
                <div className="flex items-center gap-1.5 text-ink/55 text-[11px] font-600"><Icon d={I.coins} c="#3F9D7A" s={15}/> RENTA / MES</div>
                <p className="font-display text-2xl font-600 text-moss mt-0.5">${fmt2(rentShown)}</p>
                <p className="text-[10px] text-ink/45">llega completa, sin descuentos</p>
              </div>
              <div className="bg-white rounded-2xl p-3 shadow-soft">
                <div className="flex items-center gap-1.5 text-ink/55 text-[11px] font-600"><Icon d={I.bolt} c="#7C5CCE" s={15}/> APORTE AUTO</div>
                <p className="font-display text-2xl font-600 mt-0.5">$5<span className="text-sm text-ink/50">/sem</span></p>
                <p className="text-[10px] text-ink/45">débito recurrente activo</p>
              </div>
            </div>

            {/* roundup toggle */}
            <div className="px-5 pb-2">
              <button onClick={()=>setRoundup(r=>!r)} className="w-full flex items-center justify-between bg-white rounded-2xl p-3 shadow-soft tabx">
                <div className="text-left">
                  <p className="text-sm font-700">Redondeo de compras</p>
                  <p className="text-[11px] text-ink/50">{roundup? `+ $${roundupMonthly}/mes estimado al nido` : 'Redondea cada compra y mete el vuelto'}</p>
                </div>
                <div className={"w-11 h-6 rounded-full p-0.5 tabx "+(roundup?'bg-moss':'bg-ink/15')}>
                  <div className={"w-5 h-5 rounded-full bg-white shadow tabx "+(roundup?'translate-x-5':'')}></div>
                </div>
              </button>
            </div>

            {/* portfolio */}
            <div className="px-5 pb-3">
              <p className="text-[11px] font-600 text-ink/50 uppercase tracking-wider mb-2">Tu portafolio · diversificado por ti</p>
              <div className="space-y-2">
                {props.map(p=>(
                  <div key={p.id} className="flex items-center gap-3 bg-white rounded-2xl p-2.5 shadow-soft">
                    <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style={{background:p.sc}}>
                      <Icon d={I.home} c={p.c} s={18}/>
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className="text-[13px] font-700 leading-tight truncate">{p.name}</p>
                      <p className="text-[11px] text-ink/50">{p.kind} · {p.yield}% anual</p>
                    </div>
                    <div className="text-right">
                      <p className="text-[13px] font-700">${fmt(p.frac)}</p>
                      <p className="text-[10px] text-moss">+${fmt2(p.rent)}/mes</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* actions */}
            <div className="px-5 pb-5 pt-1 grid grid-cols-2 gap-2.5 sticky bottom-0 bg-cream">
              <button onClick={aportar} className="bg-lav text-white rounded-2xl py-3 font-700 text-sm shadow-soft active:scale-95 tabx">Aportar ahora +$5</button>
              <button onClick={()=>setSellOpen(true)} className="bg-white border border-lav-soft text-lav rounded-2xl py-3 font-700 text-sm shadow-soft active:scale-95 tabx">Vender una fracción</button>
            </div>
          </div>
        </div>

        {/* SIDE: explainer cards */}
        <div className="grid sm:grid-cols-2 gap-4 lg:pt-2">
          <div className="bg-white rounded-3xl p-5 shadow-soft sm:col-span-2">
            <div className="flex items-center gap-2 mb-1"><Icon d={I.trend} c="#7C5CCE"/><h3 className="font-display text-xl font-600">En 3 años, si no haces nada más</h3></div>
            <p className="text-ink/60 text-sm">Manteniendo tus $5 semanales y reinvirtiendo la renta, tu nido pasaría de <b className="text-ink">${fmt(invested)}</b> a cerca de <b className="text-lav">${fmt(proj)}</b>. El hábito hace el trabajo, no el monto.</p>
            <div className="mt-3 flex items-end gap-2 h-24">
              {[invested, Math.round(invested*1.08+260), Math.round((invested*1.08+260)*1.08+260), proj].map((v,i)=>(
                <div key={i} className="flex-1 flex flex-col items-center justify-end">
                  <div className="w-full rounded-t-lg bg-lav-soft" style={{height:(v/proj*100)+'%',background:i===3?'#7C5CCE':'#C9B8E8'}}></div>
                  <span className="text-[10px] text-ink/45 mt-1">{i===0?'Hoy':'Año '+i}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="bg-white rounded-3xl p-5 shadow-soft">
            <div className="w-10 h-10 rounded-xl bg-rose/50 flex items-center justify-center mb-2"><Icon d={I.coins} c="#D98B9E"/></div>
            <h3 className="font-700 text-[15px]">La renta llega completa</h3>
            <p className="text-ink/60 text-sm mt-1">Nido no te cobra por entrar ni te descuenta de la renta. Gana con una comisión sobre el saldo y un diferencial al estructurar cada edificio.</p>
          </div>
          <div className="bg-white rounded-3xl p-5 shadow-soft">
            <div className="w-10 h-10 rounded-xl bg-sky-soft flex items-center justify-center mb-2"><Icon d={I.bolt} c="#4A90D9"/></div>
            <h3 className="font-700 text-[15px]">Sales cuando quieras</h3>
            <p className="text-ink/60 text-sm mt-1">A diferencia de comprar un departamento entero o un crowdfunding que te encierra años, vendes tu fracción en el mercado interno y tienes la plata en días.</p>
          </div>
        </div>
      </main>
      ) : (
      // MOTOR TAB
      <main className="max-w-4xl mx-auto px-5 pb-16">
        <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-soft">
          <div className="flex items-center gap-2 mb-1"><Icon d={I.shield} c="#3F9D7A"/><h2 className="font-display text-2xl font-600">Cómo trabaja tu plata, por dentro</h2></div>
          <p className="text-ink/60 mb-6 max-w-2xl">El respaldo de confianza para alguien que nunca invirtió: tu $5 no se va a un edificio cualquiera. Esto pasa por debajo.</p>
          <ol className="space-y-4">
            {[
              ["Junta",I.coins,"#7C5CCE","#C9B8E8","Nido reúne los micro-montos de miles de ahorristas en un solo fondo. Tu $5 viaja con el de todos."],
              ["Elige",I.sparkle,"#4A90D9","#A8D0F0","Una capa de inteligencia artificial (IA) filtra propiedades por rendimiento neto y riesgo, y arma un portafolio diversificado. Tú no eliges edificio."],
              ["Estructura",I.shield,"#3F9D7A","#BFE3D4","Cada propiedad se fracciona bajo una estructura regulada (fideicomiso o vehículo de oferta continua). Tu fracción es tuya, aislada del operador."],
              ["Reparte",I.coins,"#D98B9E","#E8B8C4","La renta se cobra y se reparte a prorrata cada mes. Te llega completa a tu nido."],
              ["Libera",I.bolt,"#7C5CCE","#C9B8E8","Un mercado secundario interno empareja a quien quiere salir con quien quiere entrar. Por eso tienes tu plata en días, no en meses."]
            ].map((s,i)=>(
              <li key={i} className="flex gap-4 items-start">
                <div className="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0" style={{background:s[3]}}><Icon d={s[1]} c={s[2]}/></div>
                <div>
                  <p className="font-700">{i+1}. {s[0]}</p>
                  <p className="text-ink/60 text-sm mt-0.5">{s[4]}</p>
                </div>
              </li>
            ))}
          </ol>
        </div>
        <div className="text-center mt-6">
          <button onClick={()=>setTab('nido')} className="bg-lav text-white rounded-full px-6 py-2.5 font-700 text-sm shadow-soft">Volver a mi nido</button>
        </div>
      </main>
      )}

      {/* SELL MODAL */}
      {sellOpen && (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 bg-ink/40" onClick={()=>setSellOpen(false)}>
          <div className="bg-cream rounded-3xl p-6 w-full max-w-sm shadow-phone" onClick={e=>e.stopPropagation()}>
            <h3 className="font-display text-2xl font-600">Vender una fracción</h3>
            <p className="text-ink/60 text-sm mt-1">Elige cuánto liberar. El mercado interno de Nido te empareja con un comprador y la plata llega en <b className="text-ink">~2 días</b>.</p>
            <div className="grid grid-cols-3 gap-2 mt-4">
              {[100,200,400].map(a=>(
                <button key={a} onClick={()=>confirmSell(a)} className="bg-white border border-lav-soft rounded-2xl py-3 font-700 hover:bg-lav hover:text-white tabx">${a}</button>
              ))}
            </div>
            <p className="text-[11px] text-ink/45 mt-3 text-center">Sin penalización por salir. Tu renta deja de correr solo sobre lo que vendes.</p>
            <button onClick={()=>setSellOpen(false)} className="w-full mt-3 text-ink/50 text-sm font-600 py-2">Cancelar</button>
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast && <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-ink text-white px-4 py-2.5 rounded-full text-sm font-600 shadow-phone">{toast}</div>}

      {/* CREDIT */}
      <footer className="text-center pb-7">
        <p className="text-ink/40 text-xs">Idea original: Aguacate newsletter — aguacate-newsletter.beehiiv.com</p>
        <p className="text-ink/30 text-[11px] mt-1">Nido es un demo conceptual, no un producto financiero real.</p>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
