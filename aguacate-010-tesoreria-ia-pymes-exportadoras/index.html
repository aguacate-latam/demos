// ====== ANIMATED COUNTER HOOK ======
function useAnimatedNumber(target, duration = 600) {
  const [value, setValue] = useState(target);
  const previousRef = useRef(target);
  useEffect(() => {
    const start = previousRef.current;
    const end = target;
    if (start === end) return;
    const startTime = performance.now();
    let raf;
    const tick = (now) => {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic
      setValue(start + (end - start) * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
      else previousRef.current = end;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return value;
}

  return (
    <div className="fixed inset-0 bg-navy/40 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-6">
          <h2 className="font-display text-2xl text-navy font-bold">Nueva conversión</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-navy"><Icon name="close" /></button>
        </div>
        <div className="space-y-4 mb-6">
          <div>
            <label className="text-xs uppercase tracking-wider text-slate-500 font-semibold">Desde</label>
            <select value={from} onChange={e => setFrom(e.target.value)} className="w-full mt-1 border border-slate-300 rounded-lg px-3 py-2.5 text-sm">
              <option>USD</option><option>EUR</option><option>PEN</option><option>MXN</option>
            </select>
          </div>
          <div>
            <label className="text-xs uppercase tracking-wider text-slate-500 font-semibold">Monto</label>
            <input value={amount} onChange={e => setAmount(e.target.value)} type="number" className="w-full mt-1 border border-slate-300 rounded-lg px-3 py-2.5 text-sm font-mono" />
          </div>
          <div>
            <label className="text-xs uppercase tracking-wider text-slate-500 font-semibold">A</label>
            <select value={to} onChange={e => setTo(e.target.value)} className="w-full mt-1 border border-slate-300 rounded-lg px-3 py-2.5 text-sm">
              <option>PEN</option><option>MXN</option><option>BRL</option><option>CLP</option>
            </select>
          </div>
          <div className="bg-ice rounded-lg p-4">
            <p className="text-xs text-slate-500 mb-1">Rate proyectado</p>
            <p className="font-display text-2xl text-navy font-bold">{from} {amount} → {to} {Math.round(result).toLocaleString('es-PE')}</p>
          </div>
        </div>
        <button onClick={onConfirm} className="w-full bg-signal text-navy font-semibold py-3 rounded-lg hover:bg-signal-deep transition">Programar conversión</button>
      </div>
    </div>
  );
};

const Toast = ({ message, show }) => (
  <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 bg-navy text-white px-6 py-3 rounded-lg shadow-2xl z-50 text-sm font-semibold transition-all ${show ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>
    {message}
  </div>
);

const SlideOver = ({ tx, onClose }) => {
  if (!tx) return null;
  return (
    <>
      <div className="fixed inset-0 bg-navy/30 backdrop-blur-sm z-40" onClick={onClose}></div>
      <div className="fixed top-0 right-0 h-screen w-full max-w-md bg-white shadow-2xl z-50 overflow-y-auto">
        <div className="px-6 py-5 border-b border-slate-200 flex items-center justify-between sticky top-0 bg-white">
          <h2 className="font-display text-xl text-navy font-bold">Detalle transacción</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-navy"><Icon name="close" /></button>
        </div>
        <div className="px-6 py-6 space-y-6">
          <div>
            <p className="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-1">Tipo</p>
            <p className="font-display text-2xl text-navy font-bold">{tx.type}</p>
            <p className="text-3xl font-display text-navy font-bold mt-2">{tx.amount}</p>
          </div>
          <div>
            <p className="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-1">Counterparty</p>
            <p className="text-base text-slate-700 font-medium">{tx.counterparty}</p>
          </div>
          <div className="grid grid-cols-2 gap-4">
            <div>
              <p className="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-1">Rail</p>
              <p className="text-sm text-slate-700">{tx.rail}</p>
            </div>
            <div>
              <p className="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-1">Fecha</p>
              <p className="text-sm text-slate-700">{tx.date}</p>
            </div>
          </div>
          <div className="bg-ice rounded-xl p-5">
            <p className="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-3">Breakdown FX</p>
            <div className="space-y-2 text-sm">
              <div className="flex justify-between text-slate-600"><span>Rate interbancario</span><span className="font-mono">3.790</span></div>
              <div className="flex justify-between text-slate-600"><span>Spread Cresta</span><span className="font-mono">0.7%</span></div>
              <div className="flex justify-between text-slate-600"><span>Rate aplicado</span><span className="font-mono">3.764</span></div>
              <div className="flex justify-between text-navy font-bold border-t border-slate-300 pt-2"><span>Total recibido</span><span className="font-mono">S/46,673.60</span></div>
            </div>
          </div>
          <div className="bg-ice rounded-xl p-5">
            <p className="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-3">Retención aplicada</p>
            <p className="text-sm text-slate-700">🇵🇪 SUNAT — Retención IGV 1.5% sobre el monto convertido. Comprobante generado y enviado a contadora.</p>
          </div>
          <button className="w-full bg-navy text-white font-semibold py-3 rounded-lg hover:bg-navy-soft transition flex items-center justify-center gap-2">
            <Icon name="download" className="w-4 h-4" />
            Descargar comprobante
          </button>
        </div>
      </div>
    </>
  );
};

// ====== APP ======

function App() {
  const [activeNav, setActiveNav] = useState("dashboard");
  const [balances, setBalances] = useState(INITIAL_BALANCES);
  const [transactions, setTransactions] = useState(INITIAL_TX);
  const [wireStatus, setWireStatus] = useState("pending");
  const [convertModalOpen, setConvertModalOpen] = useState(false);
  const [newConversionOpen, setNewConversionOpen] = useState(false);
  const [selectedTx, setSelectedTx] = useState(null);
  const [toast, setToast] = useState(null);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);

  const handleConfirmConvert = () => {
    setConvertModalOpen(false);
    setWireStatus("converted");
    setBalances(prev => ({
      ...prev,
      USD: { ...prev.USD, amount: prev.USD.amount - 12400, delta: "− USD 12,400 hoy", deltaPositive: false },
      PEN: { ...prev.PEN, amount: prev.PEN.amount + 46673.60, delta: "+ S/46,673 hoy", deltaPositive: true },
    }));
    setTransactions(prev => [
      { id: Date.now(), type: "Conversión", amount: "USD 12,400 → PEN 46,673.60", counterparty: "Spread 0.7%", rail: "FX", date: "ahora", status: "Completado" },
      ...prev
    ]);
    setToast("Conversión completada · S/46,673.60 en tu cuenta PEN");
    setTimeout(() => setToast(null), 3500);
  };

  const handleNewConversion = () => {
    setNewConversionOpen(false);
    setToast("Conversión programada");
    setTimeout(() => setToast(null), 3000);
  };

  return (
    <div className="min-h-screen bg-ice">
      <Sidebar active={activeNav} onSelect={setActiveNav} mobileOpen={mobileNavOpen} setMobileOpen={setMobileNavOpen} />
      <TopBar onNewConversion={() => setNewConversionOpen(true)} setMobileOpen={setMobileNavOpen} />

      <main className="md:ml-60 px-4 md:px-8 py-6 md:py-8">
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          {/* Row 1 */}
          <div className="lg:col-span-4">
            <BalanceCard balances={balances} />
          </div>
          <div className="lg:col-span-4">
            <WireCard wire={{ status: wireStatus }} onConvert={() => setConvertModalOpen(true)} />
          </div>
          <div className="lg:col-span-4">
            <AgenteCard />
          </div>

          {/* Row 2 */}
          <div className="lg:col-span-8">
            <TransactionTable transactions={transactions} onRowClick={setSelectedTx} />
          </div>
          <div className="lg:col-span-4">
            <ReconcileCard />
          </div>

          {/* Row 3 */}
          <div className="lg:col-span-12">
            <ComplianceCard />
          </div>
        </div>
      </main>

      <ConvertModal open={convertModalOpen} onClose={() => setConvertModalOpen(false)} onConfirm={handleConfirmConvert} />
      <NewConversionModal open={newConversionOpen} onClose={() => setNewConversionOpen(false)} onConfirm={handleNewConversion} />
      <SlideOver tx={selectedTx} onClose={() => setSelectedTx(null)} />
      <Toast message={toast} show={!!toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
