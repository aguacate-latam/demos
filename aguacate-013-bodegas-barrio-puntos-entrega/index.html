<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Esquina — Tu paquete te espera en la esquina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { cobalt:'#2563EB', coral:'#F43F5E', lime:'#A3E635', sand:'#F7F2E9', ink:'#1A1625' },
  fontFamily: { display:['Sora','sans-serif'], sans:['Inter','sans-serif'] }
}}}
</script>
<style>
  html,body{background:#EEE7DA;margin:0}
  *{-webkit-tap-highlight-color:transparent}
  .font-600{font-weight:600}.font-700{font-weight:700}.font-800{font-weight:800}
  .shadow-card{box-shadow:0 8px 0 -2px rgba(26,22,37,.08), 0 18px 36px -16px rgba(26,22,37,.30)}
  .hardborder{border:2px solid #1A1625}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
  .pop{animation:pop .45s ease}
  .tabx{transition:all .2s ease}
  @keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .slidein{animation:slidein .35s ease}
  @keyframes grow{from{transform:scaleY(.2);opacity:0}to{transform:scaleY(1);opacity:1}}
  .grow{transform-origin:bottom;animation:grow .6s cubic-bezier(.22,1,.36,1) both}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef} = React;
const money = (n)=> n.toLocaleString('es-419',{minimumFractionDigits:2,maximumFractionDigits:2});
const k = (n)=> n.toLocaleString('es-419');
const Icon=({d,c="#1A1625",s=20,sw=1.9})=>(<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{d}</svg>);
const I={
  box:<path d="M3 8l9-5 9 5v8l-9 5-9-5z M3 8l9 5 9-5 M12 13v8"/>,
  store:<path d="M4 10V21h16V10 M3 6l1-3h16l1 3 M3 6h18"/>,
  user:<path d="M20 21a8 8 0 0 0-16 0 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>,
  check:<path d="M20 6L9 17l-5-5"/>,
  bolt:<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>,
  coins:<g><ellipse cx="8" cy="6" rx="5" ry="2.5"/><path d="M3 6v5c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5V6"/><ellipse cx="16" cy="14" rx="5" ry="2.5"/><path d="M11 14v5c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-5"/></g>,
  grid:<path d="M3 3h7v7H3z M14 3h7v7h-7z M14 14h7v7h-7z M3 14h7v7H3z"/>,
  play:<path d="M5 3l14 9-14 9z"/>
};
const FEE=2.00, COMM=1.00;

function App(){
  const [view,setView]=useState('sim'); // sim | dash
  const [pkg,setPkg]=useState({status:'idle', code:'1408', cod:14.90});
  const [codInput,setCodInput]=useState('');
  const [cod,setCod]=useState(true);
  const [m,setM]=useState({paquetes:24, fee:48.00, comm:24.00, codrec:312.00, margen:27.60});
  const [bump,setBump]=useState(0);
  const [toast,setToast]=useState(null);
  const [tray,setTray]=useState(false);
  const timers=useRef([]);
  const showToast=(t)=>{setToast(t);setTimeout(()=>setToast(null),2200);};

  const simular=()=>{
    timers.current.forEach(clearTimeout); timers.current=[];
    setCodInput(''); setTray(false); setView('sim');
    setPkg(p=>({...p, status:'camino', code:String(1000+Math.floor(Math.random()*8999)), cod:+(8+Math.random()*22).toFixed(2)}));
    showToast('El e-commerce despachó el paquete');
    timers.current.push(setTimeout(()=>{ setPkg(p=>({...p,status:'bodega'})); setTray(true); showToast('La bodega recibió el paquete'); },1500));
  };
  const entregar=()=>{
    if(pkg.status!=='bodega'){ showToast('No hay paquete por entregar'); return; }
    if(codInput!==pkg.code){ showToast('Código incorrecto — pídele el de Camila'); return; }
    setPkg(p=>({...p,status:'recogido'})); setTray(false);
    const codFee = cod ? +(pkg.cod*0.01).toFixed(2) : 0;
    setM(x=>({ paquetes:x.paquetes+1, fee:+(x.fee+FEE).toFixed(2), comm:+(x.comm+COMM).toFixed(2),
      codrec:+(x.codrec+(cod?pkg.cod:0)).toFixed(2), margen:+(x.margen+(FEE-COMM)+codFee).toFixed(2) }));
    setBump(b=>b+1); showToast('Camila recogió con su código ✓');
  };
  const step = pkg.status==='idle'?0 : pkg.status==='camino'?1 : pkg.status==='bodega'?2 : 3;

  const Node=({n,label,active,color})=>(
    <div className="flex items-center gap-2">
      <div className={"w-7 h-7 rounded-full hardborder flex items-center justify-center text-[12px] font-800 tabx "+(active?'text-white':'bg-white text-ink/40')} style={active?{background:color}:{}}>{active?<Icon d={I.check} c="#fff" s={14} sw={2.6}/>:n}</div>
      <span className={"text-[12.5px] font-700 tabx "+(active?'text-ink':'text-ink/40')}>{label}</span>
    </div>
  );

  // ---- Dashboard data (vista de negocio a escala, mensual) ----
  const dias=[180,210,195,242,224,261,193];
  const maxd=Math.max(...dias);
  const topBodegas=[["Bodega de don Aníbal",142],["Abasto La Bendición",118],["Minimercado El Vecino",96],["Bodega Carmen",74],["Súper La Esquina",61]];

  return (
    <div className="min-h-screen font-sans text-ink" style={{background:'radial-gradient(1100px 600px at 85% -10%, #DCE7FF 0%, #EEE7DA 50%)'}}>
      <header className="max-w-7xl mx-auto px-5 pt-6 pb-3 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <div className="w-10 h-10 rounded-xl bg-cobalt hardborder flex items-center justify-center"><Icon d={I.store} c="#fff" s={20}/></div>
          <span className="font-display text-2xl font-700 tracking-tight">Esquina</span>
        </div>
        <button onClick={simular} className="bg-coral text-white hardborder rounded-xl px-5 py-2.5 font-700 text-sm shadow-card active:translate-y-0.5 tabx">Simular una entrega →</button>
      </header>

      <div className="max-w-7xl mx-auto px-5 pb-3">
        <h1 className="font-display text-3xl sm:text-4xl font-700 leading-tight max-w-3xl">Tu paquete te espera <span className="text-cobalt">en la esquina</span>.</h1>
        <p className="text-ink/60 mt-2 max-w-3xl">La bodega de barrio convertida en punto de entrega de e-commerce. Mira el <b>flujo</b> de una entrega, o entra al <b>dashboard del operador</b> —el negocio que construyes.</p>
        {/* TABS */}
        <div className="inline-flex items-center gap-1 bg-white hardborder rounded-xl p-1 mt-4 shadow-card">
          <button onClick={()=>setView('sim')} className={"flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-sm font-700 tabx "+(view==='sim'?'bg-ink text-sand':'text-ink/55')}><Icon d={I.play} c={view==='sim'?'#A3E635':'#9aa'} s={14}/>Simulación</button>
          <button onClick={()=>setView('dash')} className={"flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-sm font-700 tabx "+(view==='dash'?'bg-ink text-sand':'text-ink/55')}><Icon d={I.grid} c={view==='dash'?'#A3E635':'#9aa'} s={14}/>Dashboard del operador</button>
        </div>
      </div>

      {view==='sim' ? (<React.Fragment>
      {/* FLOW STRIP */}
      <div className="max-w-7xl mx-auto px-5 mt-1">
        <div className="bg-white hardborder rounded-2xl px-4 py-3 shadow-card flex flex-wrap items-center gap-x-2 gap-y-2 justify-between">
          <Node n="1" label="El e-commerce despacha" active={step>=1} color="#2563EB"/>
          <div className="flex-1 min-w-[16px] border-t-2 border-dashed border-ink/25 hidden sm:block"></div>
          <Node n="2" label="La bodega recibe" active={step>=2} color="#F43F5E"/>
          <div className="flex-1 min-w-[16px] border-t-2 border-dashed border-ink/25 hidden sm:block"></div>
          <Node n="3" label="Camila recoge con su código" active={step>=3} color="#65A30D"/>
          <div className="flex-1 min-w-[16px] border-t-2 border-dashed border-ink/25 hidden sm:block"></div>
          <Node n="4" label="Tú, el operador, cobras" active={step>=3} color="#1A1625"/>
        </div>
      </div>

      <main className="max-w-7xl mx-auto px-5 py-5 grid lg:grid-cols-3 gap-5 items-start">
        {/* 2 · LA BODEGA */}
        <section className="bg-white hardborder rounded-2xl p-5 shadow-card">
          <div className="flex items-center gap-2 mb-1"><div className="w-8 h-8 rounded-lg bg-coral/15 hardborder flex items-center justify-center"><Icon d={I.store} c="#F43F5E" s={16}/></div><h2 className="font-display font-700">La bodega</h2><span className="ml-auto text-[11px] font-700 bg-coral/15 text-coral rounded-full px-2 py-0.5">paso 2 · recibe</span></div>
          <p className="text-ink/55 text-sm mb-3">Don Aníbal recibe el paquete del e-commerce y se lo guarda a Camila. Cuando ella pasa, le pide su código y se lo entrega.</p>
          <div className="mb-3">
            <p className="text-[11px] font-700 text-ink/50 uppercase tracking-wide mb-1">Bandeja de entrada</p>
            {tray ? (
              <div className="slidein bg-cobalt/8 hardborder rounded-xl p-3 flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-cobalt flex items-center justify-center"><Icon d={I.box} c="#fff" s={18}/></div>
                <div className="flex-1"><p className="text-sm font-700">Paquete para Camila</p><p className="text-[11px] text-ink/50">Recibido · esperando a que pase a recogerlo</p></div>
              </div>
            ) : <div className="bg-ink/5 rounded-xl p-3 text-center text-ink/40 text-sm">Sin paquetes por entregar</div>}
          </div>
          <p className="text-[12px] text-ink/55 mb-1.5">Cuando Camila llegue, pídele su código:</p>
          <div className="flex gap-2 mb-3">
            <input value={codInput} onChange={e=>setCodInput(e.target.value.replace(/\D/g,'').slice(0,4))} placeholder="Código de Camila" inputMode="numeric" className="flex-1 hardborder rounded-xl px-3 py-2.5 font-display font-700 tracking-widest text-center outline-none focus:bg-sand"/>
            <button onClick={entregar} className="bg-cobalt text-white hardborder rounded-xl px-4 font-700 text-sm shadow-card active:translate-y-0.5 tabx">Entregar</button>
          </div>
          <div className="bg-lime/30 hardborder rounded-xl p-3 flex items-center justify-between">
            <div><p className="text-[11px] font-700 text-ink/50 uppercase tracking-wide">Ganas por paquete</p><p className="font-display text-xl font-800 leading-none">${money(COMM)}</p></div>
            <div className="text-right"><p className="text-[11px] text-ink/50">Hoy · {m.paquetes} entregas</p><p key={bump} className="font-display font-700 text-[#3f6212] pop">${money(m.comm)}</p></div>
          </div>
        </section>

        {/* 3 · EL COMPRADOR */}
        <section className="bg-white hardborder rounded-2xl p-5 shadow-card">
          <div className="flex items-center gap-2 mb-1"><div className="w-8 h-8 rounded-lg bg-sand hardborder flex items-center justify-center"><Icon d={I.user} s={16}/></div><h2 className="font-display font-700">El comprador</h2><span className="ml-auto text-[11px] font-700 bg-lime/40 text-[#3f6212] rounded-full px-2 py-0.5">paso 3 · recoge</span></div>
          <p className="text-ink/55 text-sm mb-3">Camila compró en línea y eligió "recoger en la esquina" en vez de envío a casa.</p>
          <div className="space-y-2 mb-4">
            {[["El e-commerce lo despachó",1],["En tu bodega",2],["Recogido",3]].map(([t,n])=>(
              <div key={n} className={"flex items-center gap-2 text-sm font-600 "+(step>=n?'text-ink':'text-ink/35')}>
                <div className={"w-5 h-5 rounded-full hardborder flex items-center justify-center "+(step>=n?'bg-lime':'bg-white')}>{step>=n && <Icon d={I.check} s={12} sw={2.6}/>}</div>{t}
              </div>
            ))}
          </div>
          <div className="bg-sand hardborder rounded-xl p-3 mb-3">
            <p className="text-[11px] font-700 text-ink/50 uppercase tracking-wide">Muéstrale este código en la bodega</p>
            <p className="font-display text-3xl font-800 tracking-[0.25em] text-cobalt">{pkg.status==='idle'?'— — — —':pkg.code}</p>
            <p className="text-[12px] text-ink/55 mt-1">Bodega de don Aníbal · a 50 m · abre 7am–10pm</p>
          </div>
          {cod && pkg.status!=='idle' && <div className="flex items-center justify-between bg-coral/10 rounded-xl px-3 py-2"><span className="text-sm font-600">Pagas tu pedido al recoger</span><span className="font-display font-700 text-coral">${money(pkg.cod)}</span></div>}
          {pkg.status==='recogido' && <div className="mt-3 flex items-center gap-2 bg-lime/30 hardborder rounded-xl px-3 py-2.5"><Icon d={I.check} c="#3f6212" s={18} sw={2.4}/><span className="text-sm font-700">Recogido con tu código</span></div>}
        </section>

        {/* 4 · OPERADOR (live mini) */}
        <section className="bg-ink text-sand hardborder rounded-2xl p-5 shadow-card">
          <div className="flex items-center gap-2 mb-1"><div className="w-8 h-8 rounded-lg bg-lime flex items-center justify-center"><Icon d={I.bolt} c="#1A1625" s={16}/></div><h2 className="font-display font-700 text-sand">El operador — en vivo</h2><span className="ml-auto text-[11px] font-700 bg-lime/20 text-lime rounded-full px-2 py-0.5">paso 4</span></div>
          <p className="text-sand/55 text-sm mb-4">Ganas el spread: el courier paga $2,00/paq, le pagas $1,00/paq a la bodega, más un fee chico del COD. Sin flota.</p>
          <div className="grid grid-cols-2 gap-2.5">
            {[["Paquetes hoy",m.paquetes,'','#A3E635'],["Bodegas activas",38,'','#A3E635'],["Fee del courier",'$'+money(m.fee),'$2,00/paq','#93C5FD'],["Comisión bodegas",'$'+money(m.comm),'$1,00/paq','#FDA4AF'],["COD reconciliado",'$'+money(m.codrec),'efectivo de pedidos','#FDE68A'],["Tu margen hoy",'$'+money(m.margen),'spread + fee COD','#A3E635']].map((c,i)=>(
              <div key={i} className={"rounded-xl p-3 "+(i===5?'col-span-2 bg-lime/15 border-2 border-lime':'bg-white/5')}>
                <p className="text-[10.5px] font-600 text-sand/55 uppercase tracking-wide">{c[0]}</p>
                <p key={bump} className="font-display text-xl font-800 pop" style={{color:c[3]}}>{c[1]}</p>
                {c[2] && <p className="text-[10px] text-sand/40">{c[2]}</p>}
              </div>
            ))}
          </div>
          <button onClick={()=>setCod(v=>!v)} className="w-full mt-3 flex items-center justify-between bg-white/5 rounded-xl px-3 py-2.5 tabx">
            <span className="text-sm font-600 text-sand/80">Contra-entrega (COD) en efectivo</span>
            <div className={"rounded-full p-0.5 tabx "+(cod?'bg-lime':'bg-white/20')} style={{height:'22px',width:'40px'}}><div className={"w-4 h-4 rounded-full bg-white tabx "+(cod?'translate-x-5':'')}></div></div>
          </button>
        </section>
      </main>
      </React.Fragment>) : (
      /* ===== DASHBOARD DEL OPERADOR (negocio a escala, mes) ===== */
      <main className="max-w-7xl mx-auto px-5 py-5 slidein">
        <div className="flex items-center justify-between flex-wrap gap-2 mb-4">
          <div>
            <h2 className="font-display text-2xl font-800">Dashboard del operador</h2>
            <p className="text-ink/55 text-sm">Esquina · Caracas · este mes</p>
          </div>
          <span className="text-[12px] font-700 bg-lime/40 text-[#3f6212] hardborder rounded-full px-3 py-1">38 bodegas en red</span>
        </div>
        {/* KPI cards */}
        <div className="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-5">
          {[
            ["Paquetes entregados","6.200","este mes","#2563EB"],
            ["Ingreso (fee del courier)","$12.400","$2,00 × 6.200","#2563EB"],
            ["Comisión pagada a bodegas","$6.200","$1,00 × 6.200","#F43F5E"],
            ["COD reconciliado","$93.480","efectivo de pedidos","#65A30D"],
            ["Tasa de entrega exitosa","98,4%","vs. ~80% a domicilio","#65A30D"],
            ["Tu margen del mes","$7.130","spread + fee COD","#1A1625"],
          ].map((c,i)=>(
            <div key={i} className={"hardborder rounded-2xl p-4 shadow-card "+(i===5?'col-span-2 lg:col-span-1 bg-ink':'bg-white')} style={i===5?{borderColor:'#A3E635'}:{}}>
              <p className={"text-[11px] font-700 uppercase tracking-wide "+(i===5?'text-lime':'text-ink/45')}>{c[0]}</p>
              <p className={"font-display text-3xl font-800 mt-1 "+(i===5?'text-lime':'')} style={i===5?{}:{color:c[3]}}>{c[1]}</p>
              <p className={"text-[12px] mt-0.5 font-600 "+(i===5?'text-sand/75':'text-ink/45')}>{c[2]}</p>
            </div>
          ))}
        </div>
        <div className="grid lg:grid-cols-2 gap-5">
          {/* chart */}
          <div className="bg-white hardborder rounded-2xl p-5 shadow-card">
            <h3 className="font-display font-700 mb-1">Paquetes por día</h3>
            <p className="text-ink/50 text-sm mb-4">Últimos 7 días</p>
            <div className="flex items-end gap-2" style={{minHeight:'172px'}}>
              {dias.map((v,i)=>(
                <div key={i} className="flex-1 flex flex-col items-center justify-end gap-1">
                  <span className="text-[11px] font-700 text-ink/60">{v}</span>
                  <div className="w-full rounded-t-lg hardborder grow" style={{height:Math.round(v/maxd*140)+'px', background:i===6?'#A3E635':'#2563EB', animationDelay:(i*60)+'ms'}}></div>
                  <span className="text-[10px] text-ink/40">{["L","M","M","J","V","S","D"][i]}</span>
                </div>
              ))}
            </div>
          </div>
          {/* top bodegas */}
          <div className="bg-white hardborder rounded-2xl p-5 shadow-card">
            <h3 className="font-display font-700 mb-1">Top bodegas</h3>
            <p className="text-ink/50 text-sm mb-3">Por paquetes entregados este mes</p>
            <div className="space-y-2">
              {topBodegas.map(([name,paq],i)=>(
                <div key={i} className="flex items-center gap-3">
                  <span className="font-display font-800 text-ink/30 w-5">{i+1}</span>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-700 truncate">{name}</p>
                    <div className="h-1.5 rounded-full bg-ink/10 mt-1 overflow-hidden"><div className="h-full bg-coral" style={{width:(paq/142*100)+'%'}}></div></div>
                  </div>
                  <div className="text-right"><p className="text-sm font-700">{paq} paq</p><p className="text-[11px] text-[#3f6212]">${money(paq)}</p></div>
                </div>
              ))}
            </div>
          </div>
        </div>
        <p className="text-ink/45 text-sm mt-5 max-w-2xl">Tú no tienes flota ni inventario: cobras al courier por entrega, le pagas su comisión a la bodega, y el margen crece con la densidad de la red. <button onClick={simular} className="font-700 text-cobalt underline">Mira una entrega en vivo →</button></p>
      </main>
      )}

      {toast && <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-ink text-sand px-4 py-2.5 rounded-full text-sm font-600 shadow-card hardborder">{toast}</div>}

      <footer className="text-center pb-7 pt-2">
        <p className="text-ink/40 text-xs">Idea original: Aguacate newsletter — aguacate-newsletter.beehiiv.com</p>
        <p className="text-ink/30 text-[11px] mt-1">Esquina es un demo conceptual, no un servicio de logística real.</p>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
