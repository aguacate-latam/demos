// ============== ANIMATED COUNTER ==============
function useCounter(target, duration = 1400) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let start;
    let raf;
    const step = (ts) => {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setVal(target * eased);
      if (progress < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return val;
}

// ============== SPARKLINE ==============
const Sparkline = ({ data, color = '#C8964A' }) => {
  const w = 80, h = 24;
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;
  const points = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} className="overflow-visible">
      <polyline className="sparkline-path" points={points} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
};

  return (
    <div className="fade-up bg-bone/60 border border-ink/5 rounded-sm p-3" style={{ animationDelay: `${delay}ms` }}>

      <div className="flex items-end justify-between gap-2">
        <div className="font-display text-2xl text-ink leading-none">{prefix}{display}{suffix}</div>
        <Sparkline data={spark} />

    </div>
  );
};
