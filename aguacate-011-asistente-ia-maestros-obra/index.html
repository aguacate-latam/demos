function Counter({ target, duration = 2000, prefix = "$" }) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let start = null;
    let raf;
    const step = (ts) => {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      setVal(Math.floor(target * progress));
      if (progress < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return <span>{prefix}{val.toLocaleString('en-US')}</span>;
}

function ChatMessage({ from, children, time, delay, withDoc, withCheck, withBadge }) {

}

function Typing({ delay, removeAfter }) {

    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [delay, removeAfter]);

    <div className="flex justify-start mb-2 fade-in">

                <div key={w.name} className="px-3.5 py-2.5 flex items-center justify-between gap-2">
                  <div className="min-w-0">
                    <div className="font-semibold text-cocoa text-[14px]">{w.name}</div>
                    <div className="text-[11px] text-cocoa-light">{w.role} · {w.jornal}</div>
                  </div>

                    <IconCheck size={10} /> Pagado
                  </div>
                </div>
              ))}
              <button className="w-full px-3.5 py-2.5 flex items-center justify-center gap-1.5 text-[13px] text-saffron-dark hover:bg-saffron/10 font-semibold">
                <IconPlus size={14} /> Agregar trabajador

          </section>

          {/* Block 3: Recuperado */}
          <section>
            <div className="bg-coral/10 border-2 border-saffron/40 rounded-2xl p-5 sm:p-6">
              <div className="text-[11px] uppercase tracking-widest text-saffron-dark font-semibold mb-1">Recuperado este mes</div>
              <div className="font-display text-[56px] sm:text-[72px] leading-none font-semibold text-saffron-dark">
                <Counter target={3180} duration={2000} />
              </div>
              <div className="text-[13px] text-cocoa mt-2 leading-snug">
                Cobros que sin Capataz se hubieran perdido — 12 trabajos cerrados.
              </div>
              <Sparkline />
            </div>
          </section>

          <div className="text-center text-[11px] text-cocoa-light/70 mt-8 pb-2">
            Idea original: <a href="https://aguacate-newsletter.beehiiv.com" className="underline hover:text-cocoa" target="_blank" rel="noopener noreferrer">Aguacate newsletter</a> — aguacate-newsletter.beehiiv.com
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
