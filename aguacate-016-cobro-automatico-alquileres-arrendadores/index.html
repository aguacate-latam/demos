<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Puntual — El alquiler llega solo</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&display=swap" rel="stylesheet" />
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        tinta: '#2A2438',
        lavanda: '#7C6FC4',
        lavandaSoft: '#EDEAF8',
        mantequilla: '#F5D98B',
        cielo: '#BFD9F2',
        cieloSoft: '#EAF2FB',
        rosa: '#E3B7B0',
        rosaSoft: '#F8ECEA',
        crema: '#FBF9F4',
        cardWhite: '#FFFFFF'
      },
      fontFamily: { sans: ['"Inter Tight"', 'sans-serif'] }
    }
  }
}
</script>
<style>
  body { background:#FBF9F4; font-family:'Inter Tight',sans-serif; color:#2A2438; }
  .chat-enter { animation: chatIn .45s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes chatIn { from { opacity:0; transform:translateY(14px) scale(.97);} to { opacity:1; transform:none;} }
  .pulse-dot { animation: pulseDot 1.1s ease-in-out infinite; }
  @keyframes pulseDot { 0%,100%{opacity:.25} 50%{opacity:1} }
  .phone-scroll::-webkit-scrollbar { width:0; }
  .panel-scroll::-webkit-scrollbar { width:6px; }
  .panel-scroll::-webkit-scrollbar-thumb { background:#EDEAF8; border-radius:99px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------- íconos SVG inline (trazo) ---------- */
const Ic = {
  check: (c='') => (<svg className={"w-4 h-4 "+c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>),
  bell: (c='') => (<svg className={"w-4 h-4 "+c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>),
  doc: (c='') => (<svg className={"w-4 h-4 "+c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>),
  home: (c='') => (<svg className={"w-4 h-4 "+c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>),
  play: (c='') => (<svg className={"w-4 h-4 "+c} viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>),
  warn: (c='') => (<svg className={"w-4 h-4 "+c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>),
  cal: (c='') => (<svg className={"w-4 h-4 "+c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>),
  shield: (c='') => (<svg className={"w-4 h-4 "+c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>),
};

/* ---------- data base ---------- */
const PROPS_INIT = [
  { id:'acacias', nombre:'Las Acacias 2B', inquilino:'Diego R.', monto:350, dia:5, estado:'programado' },
  { id:'mirador', nombre:'Mirador 704', inquilino:'Carla M.', monto:420, dia:5, estado:'programado' },
  { id:'lote',    nombre:'Casa Lote 12', inquilino:'Luis P.', monto:280, dia:10, estado:'programado' },
];

const fmt = n => '$' + n.toLocaleString('es-CO', {maximumFractionDigits:0});

/* ---------- burbujas del chat ---------- */
function Bubble({ side='left', tone='base', children }) {
  const tones = {
    base: 'bg-white border border-lavandaSoft',
    aviso: 'bg-cieloSoft border border-cielo/60',
    ok: 'bg-lavandaSoft border border-lavanda/30',
    alerta: 'bg-rosaSoft border border-rosa/50',
    plata: 'bg-mantequilla/30 border border-mantequilla',
  };
  return (
    <div className={"chat-enter max-w-[86%] " + (side==='right' ? 'self-end' : 'self-start')}>
      <div className={"rounded-2xl px-3.5 py-2.5 text-[13px] leading-snug shadow-sm " + tones[tone]}>{children}</div>
    </div>
  );
}

function App() {
  const [props_, setProps] = useState(PROPS_INIT);
  const [chat, setChat] = useState([
    { tone:'base', side:'left', body:(<span><b>Puntual</b> · Hola Diego 👋 Tu contrato de <b>Las Acacias 2B</b> quedó activo. Autorizaste el débito de tu alquiler una sola vez — yo me encargo del resto.</span>) },
  ]);
  const [cobrado, setCobrado] = useState(0);
  const [cobradoTarget, setCobradoTarget] = useState(0);
  const [recibos, setRecibos] = useState(0);
  const [moraEvitada, setMoraEvitada] = useState(0);
  const [simulando, setSimulando] = useState(false);
  const [simulado, setSimulado] = useState(false);
  const [plan, setPlan] = useState(null); // null | 'ofrecido' | 'activo'
  const [ajusteOpen, setAjusteOpen] = useState(false);
  const [eventos, setEventos] = useState([{t:'Hoy', d:'Contratos activos · 3 propiedades sincronizadas'}]);
  const chatRef = useRef(null);

  /* contador animado */
  useEffect(() => {
    if (cobrado === cobradoTarget) return;
    const step = Math.max(1, Math.round((cobradoTarget - cobrado) / 14));
    const id = setTimeout(() => setCobrado(c => Math.min(cobradoTarget, c + step)), 28);
    return () => clearTimeout(id);
  }, [cobrado, cobradoTarget]);

  useEffect(() => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; }, [chat, plan]);

  const pushChat = (msg) => setChat(c => [...c, msg]);
  const pushEvento = (d) => setEventos(e => [{t:'Día 5', d}, ...e]);
  const setEstado = (id, estado) => setProps(ps => ps.map(p => p.id===id ? {...p, estado} : p));

  /* FLUJO 1 + 2: día de cobro con fricción real */
  const simularCobro = useCallback(() => {
    if (simulando || simulado) return;
    setSimulando(true);
    const seq = [
      [400, () => pushChat({tone:'aviso', side:'left', body:(<span>{Ic.bell('inline mr-1 text-lavanda')}Mañana es <b>día 5</b> — tu alquiler de <b>$350 USD</b> se debitará de tu cuenta autorizada.</span>)})],
      [1500, () => { pushChat({tone:'ok', side:'left', body:(<span>{Ic.check('inline mr-1 text-lavanda')}<b>Pago recibido: $350 USD.</b> Llegó directo a la cuenta de tu arrendadora. Quedaste al día ✓</span>)}); setEstado('acacias','pagado'); setCobradoTarget(t => t + 350); setRecibos(r => r + 1); pushEvento('Las Acacias 2B · débito ejecutado y conciliado'); }],
      [2600, () => pushChat({tone:'base', side:'left', body:(<span>{Ic.doc('inline mr-1 text-tinta/60')}Tu <b>recibo de junio</b> está listo (PDF) · Historial: <b>12 meses puntual</b> 🏅</span>)})],
      [3900, () => { pushEvento('Mirador 704 · débito falló — saldo insuficiente. Reintentando…'); setEstado('mirador','reintento'); }],
      [5100, () => pushChat({tone:'alerta', side:'left', body:(<span>{Ic.warn('inline mr-1 text-rosa')}<b>Carla (Mirador 704):</b> tu débito de $420 USD no pasó por saldo insuficiente. ¿Lo dividimos en <b>dos partes</b> antes del vencimiento?</span>)})],
      [6300, () => setPlan('ofrecido')],
    ];
    seq.forEach(([ms, fn]) => setTimeout(fn, ms));
  }, [simulando, simulado]);

  /* FLUJO 2b: inquilino acepta el plan */
  const aceptarPlan = () => {
    setPlan('activo');
    pushChat({tone:'base', side:'right', body:(<span>Sí, divídelo en dos ✓</span>)});
    setTimeout(() => {
      pushChat({tone:'ok', side:'left', body:(<span>{Ic.check('inline mr-1 text-lavanda')}Listo. <b>50% hoy ($210 USD)</b> y 50% el día 20. Primera parte debitada ✓</span>)});
      setEstado('mirador','plan');
      setCobradoTarget(t => t + 210);
      setMoraEvitada(m => m + 420);
      setRecibos(r => r + 1);
      pushEvento('Mirador 704 · plan de pago activo — 50% recibido, sin que muevas un dedo');
      setSimulando(false); setSimulado(true);
    }, 900);
  };

  const diasAtraso = simulado ? '0,8' : '—';

  return (
    <div className="min-h-screen flex flex-col">
      {/* topbar */}
      <header className="px-5 md:px-10 pt-6 pb-4 flex items-center justify-between">
        <div className="flex items-center gap-2.5">
          <div className="w-9 h-9 rounded-xl bg-lavanda flex items-center justify-center text-white font-extrabold text-lg">P</div>
          <div>
            <div className="font-extrabold text-lg leading-none tracking-tight">Puntual</div>
            <div className="text-[11px] text-tinta/50">El alquiler llega solo</div>
          </div>
        </div>
        <button onClick={simularCobro} disabled={simulando || simulado}
          className={"flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-semibold transition shadow-sm " + ((simulando||simulado) ? "bg-tinta/10 text-tinta/40 cursor-default" : "bg-lavanda text-white hover:opacity-90 hover:shadow-md")}>
          {Ic.play()} {simulado ? 'Mes simulado' : simulando ? 'Corriendo día 5…' : 'Simular día de cobro'}
        </button>
      </header>

      {/* split view */}
      <main className="flex-1 px-5 md:px-10 pb-6 grid md:grid-cols-[380px_1fr] gap-6 items-start">

        {/* ====== PANEL IZQ: celular del inquilino ====== */}
        <section className="mx-auto w-full max-w-[380px]">
          <div className="rounded-[2.2rem] border-[10px] border-tinta bg-crema shadow-xl overflow-hidden">
            <div className="bg-tinta text-white px-4 py-3 flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-full bg-lavanda flex items-center justify-center font-extrabold">P</div>
              <div className="leading-tight">
                <div className="text-[13px] font-semibold">Puntual</div>
                <div className="text-[10px] text-white/60 flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-mantequilla pulse-dot"></span> tu agente de alquiler</div>
              </div>
              <div className="ml-auto text-[10px] text-white/50">Diego · inquilino</div>
            </div>
            <div ref={chatRef} className="phone-scroll h-[430px] overflow-y-auto px-3 py-4 flex flex-col gap-2.5">
              {chat.map((m,i) => <Bubble key={i} side={m.side} tone={m.tone}>{m.body}</Bubble>)}
              {plan === 'ofrecido' && (
                <div className="chat-enter self-end flex gap-2">
                  <button onClick={aceptarPlan} className="rounded-full bg-lavanda text-white text-[12px] font-semibold px-4 py-2 hover:opacity-90">Dividir en dos ✓</button>
                  <button className="rounded-full bg-white border border-lavandaSoft text-[12px] px-4 py-2 text-tinta/60">Pagar completo el 20</button>
                </div>
              )}
              {plan === 'activo' && (
                <Bubble tone="plata"><span>{Ic.shield('inline mr-1 text-tinta/60')}Tu historial sigue <b>limpio</b>: el plan pactado no cuenta como mora.</span></Bubble>
              )}
            </div>
            <div className="px-3 pb-3">
              <div className="rounded-full bg-white border border-lavandaSoft px-4 py-2 text-[12px] text-tinta/40">Escribe a tu agente…</div>
            </div>
          </div>
          <p className="text-center text-[11px] text-tinta/40 mt-2">Lo que vive el inquilino</p>
        </section>

        {/* ====== PANEL DER: panel del arrendador ====== */}
        <section className="w-full">
          <div className="flex items-baseline justify-between mb-3">
            <h2 className="font-extrabold text-xl tracking-tight">Panel de Marta <span className="text-tinta/40 font-medium text-sm">· arrendadora</span></h2>
            <span className="text-[11px] text-tinta/40">junio 2026</span>
          </div>

          {/* contador hero */}
          <div className="rounded-2xl bg-white border border-lavandaSoft p-5 mb-4 shadow-sm">
            <div className="text-[12px] font-medium text-tinta/50 mb-1">Cobrado este mes</div>
            <div className="text-5xl font-extrabold tracking-tight text-tinta">{fmt(cobrado)} <span className="text-lg text-tinta/40 font-semibold">USD</span></div>
            <div className="mt-2 h-2 rounded-full bg-lavandaSoft overflow-hidden">
              <div className="h-full bg-lavanda transition-all duration-500" style={{width: Math.min(100, (cobrado/1050)*100) + '%'}}></div>
            </div>
            <div className="mt-1 text-[11px] text-tinta/40">de $1.050 USD esperados</div>
          </div>

          {/* métricas nativas */}
          <div className="grid grid-cols-3 gap-3 mb-4">
            <div className="rounded-2xl bg-mantequilla/30 border border-mantequilla p-4">
              <div className="text-[11px] font-medium text-tinta/60">Mora evitada</div>
              <div className="text-2xl font-extrabold">{moraEvitada ? fmt(moraEvitada) : '$0'}</div>
              <div className="text-[10px] text-tinta/50 mt-0.5">sin perseguir a nadie</div>
            </div>
            <div className="rounded-2xl bg-cieloSoft border border-cielo/60 p-4">
              <div className="text-[11px] font-medium text-tinta/60">Recibos emitidos</div>
              <div className="text-2xl font-extrabold">{recibos}</div>
              <div className="text-[10px] text-tinta/50 mt-0.5">listos para el impuesto anual</div>
            </div>
            <div className="rounded-2xl bg-white border border-lavandaSoft p-4">
              <div className="text-[11px] font-medium text-tinta/60">Días prom. de atraso</div>
              <div className="text-2xl font-extrabold">{diasAtraso}</div>
              <div className="text-[10px] text-tinta/50 mt-0.5">antes de Puntual: 9,4</div>
            </div>
          </div>

          {/* propiedades */}
          <div className="rounded-2xl bg-white border border-lavandaSoft shadow-sm divide-y divide-lavandaSoft mb-4">
            {props_.map(p => (
              <div key={p.id} className="flex items-center gap-3 px-4 py-3">
                <div className="w-9 h-9 rounded-xl bg-lavandaSoft flex items-center justify-center text-lavanda">{Ic.home()}</div>
                <div className="flex-1 leading-tight">
                  <div className="font-semibold text-[14px]">{p.nombre}</div>
                  <div className="text-[11px] text-tinta/50">{p.inquilino} · debita el día {p.dia}</div>
                </div>
                <div className="text-right">
                  <div className="font-extrabold">{fmt(p.monto)}</div>
                  {p.estado==='pagado' && <span className="text-[10px] font-semibold text-lavanda bg-lavandaSoft rounded-full px-2 py-0.5">Pagado ✓</span>}
                  {p.estado==='programado' && <span className="text-[10px] font-semibold text-tinta/50 bg-crema border border-lavandaSoft rounded-full px-2 py-0.5">Programado</span>}
                  {p.estado==='reintento' && <span className="text-[10px] font-semibold text-rosa bg-rosaSoft rounded-full px-2 py-0.5">Reintentando…</span>}
                  {p.estado==='plan' && <span className="text-[10px] font-semibold text-tinta bg-mantequilla/50 rounded-full px-2 py-0.5">Plan activo · 50%</span>}
                </div>
              </div>
            ))}
          </div>

          {/* FLUJO 3: ajuste anual */}
          <button onClick={() => setAjusteOpen(o => !o)} className="w-full text-left rounded-2xl bg-cieloSoft border border-cielo/60 px-4 py-3 hover:shadow-md transition mb-4">
            <div className="flex items-center gap-2 text-[13px]">
              {Ic.cal('text-tinta/50')}
              <span><b>Ajuste anual:</b> el contrato de Las Acacias 2B se ajusta <b>5,1%</b> el 1-jul — ambas partes notificadas.</span>
              <span className="ml-auto text-tinta/40 text-[11px]">{ajusteOpen ? 'cerrar' : 'ver detalle'}</span>
            </div>
            {ajusteOpen && (
              <div className="mt-3 grid grid-cols-3 gap-2 text-center">
                <div className="rounded-xl bg-white border border-cielo/60 p-3"><div className="text-[10px] text-tinta/50">Monto actual</div><div className="font-extrabold text-lg">$350</div></div>
                <div className="rounded-xl bg-white border border-cielo/60 p-3"><div className="text-[10px] text-tinta/50">Índice aplicado</div><div className="font-extrabold text-lg">+5,1%</div></div>
                <div className="rounded-xl bg-lavanda text-white p-3"><div className="text-[10px] text-white/70">Desde el 1-jul</div><div className="font-extrabold text-lg">$368</div></div>
                <div className="col-span-3 text-[11px] text-tinta/50 text-left">Aviso enviado a Diego y a ti con 30 días de anticipación. Sin conversaciones incómodas.</div>
              </div>
            )}
          </button>

          {/* actividad */}
          <div className="rounded-2xl bg-white border border-lavandaSoft p-4">
            <div className="text-[12px] font-semibold text-tinta/60 mb-2">Actividad del agente</div>
            <div className="panel-scroll max-h-[120px] overflow-y-auto flex flex-col gap-1.5">
              {eventos.map((e,i) => (
                <div key={i} className="text-[12px] text-tinta/70 flex gap-2"><span className="text-tinta/35 shrink-0 w-9">{e.t}</span> {e.d}</div>
              ))}
            </div>
          </div>
          <p className="text-center md:text-left text-[11px] text-tinta/40 mt-2">Lo que ve la arrendadora — en tiempo real</p>
        </section>
      </main>

      <footer className="px-5 pb-6 text-center">
        <p className="text-[11px] text-tinta/35">Puntual es un demo conceptual — no es un producto financiero real. · Idea original: <a className="underline hover:text-tinta/60" href="https://aguacate-newsletter.beehiiv.com" target="_blank" rel="noopener">Aguacate newsletter — aguacate-newsletter.beehiiv.com</a></p>
      </footer>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
